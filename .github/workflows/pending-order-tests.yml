name: Checkout Safety and Build Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [security/server-api-phase1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pending-order:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline pending-order tests
        run: node --experimental-strip-types --test tests/*.test.ts

  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Check server entrypoint syntax and import graph
        run: |
          bunx esbuild api/checkout/validate.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/validate.mjs
          bunx esbuild api/mercadopago/create-preference.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/checkout.mjs
          bunx esbuild api/mercadopago/webhook.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/webhook.mjs
          bunx esbuild api/admin/me.ts --bundle --platform=node --format=esm --packages=external --outfile=/tmp/admin-me.mjs

  rls-cutover-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pulsar_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pulsar_ci"
          --health-interval 5s --health-timeout 5s --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: isolated-ci-test-password
      PGDATABASE: pulsar_ci
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
      - name: Seed isolated legacy tables and unsafe policies
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/fixtures/rls_ci_schema.sql
      - name: Apply candidate migration ONLY to throwaway PostgreSQL
        run: psql --set ON_ERROR_STOP=1 --file supabase/migrations/20261103_prepare_pulsar_rls.sql
      - name: Assert privileges and restrictive policies
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/pulsar_rls_post_cutover.sql
      - name: Test public catalog and private tables as browser roles
        run: psql --set ON_ERROR_STOP=1 --file supabase/tests/rls_functional_smoke_ci.sql
